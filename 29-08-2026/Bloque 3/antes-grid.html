<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANTES - Tarjetas sin Grid</title>
  <!-- Tailwind desde CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

  <h1 class="text-2xl font-bold mb-2">ANTES: Tarjetas sueltas</h1>
  <p class="text-gray-500 mb-6">Sin grid, las tarjetas se apilan una debajo de otra. No hay control del layout.</p>

  <!-- ============================================
       CONTENEDOR SIN GRID
       Las tarjetas se apilan verticalmente porque
       div es un elemento de bloque (block).
       ============================================ -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="bg-white p-4 shadow mb-4">Tarjeta 1</div>
    <div class="bg-white p-4 shadow mb-4">Tarjeta 2</div>
    <div class="bg-white p-4 shadow mb-4">Tarjeta 3</div>
  </div>

</body>
</html>
