<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DESPUÉS - Tarjetas con Grid</title>
  <!-- Tailwind desde CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

  <h1 class="text-2xl font-bold mb-2">DESPUÉS: Tarjetas con Grid</h1>
  <p class="text-gray-500 mb-6">Con grid grid-cols-3 gap-4, las tarjetas se acomodan en 3 columnas.</p>

  <!-- ============================================
       CONTENEDOR CON GRID
       - grid: activa CSS Grid
       - grid-cols-3: crea 3 columnas de ancho igual
       - gap-4: separa las tarjetas con espacio uniforme
       ============================================ -->
  <div class="grid grid-cols-3 gap-4">
    <div class="bg-white p-4 shadow">Tarjeta 1</div>
    <div class="bg-white p-4 shadow">Tarjeta 2</div>
    <div class="bg-white p-4 shadow">Tarjeta 3</div>
  </div>

  <!-- ============================================
       RETO EXTENDIDO (nivel medio): responsive
       En mobile (< md) se ve 1 columna.
       En pantallas grandes (>= md) se ven 3.
       ============================================ -->
  <h2 class="text-xl font-bold mt-10 mb-2">Extra: responsive</h2>
  <p class="text-gray-500 mb-6">grid-cols-1 en mobile, md:grid-cols-3 en desktop.</p>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="bg-white p-4 shadow">Tarjeta A</div>
    <div class="bg-white p-4 shadow">Tarjeta B</div>
    <div class="bg-white p-4 shadow">Tarjeta C</div>
  </div>

</body>
</html>
